[grid]
en_adv = 500
cjk_adv = 1000
upm = 1000

# Was `SarasaNZSSlab NFM` (KIT-282). `base_variant` is new here: serif's
# intermediate used to ship under upstream's own `SarasaMonoSlabNeoZhiSongSC-Opt`
# stem, which is three reserved names in one file name.
[naming]
house = "AKR"
style = "Slab"
variant = "NFM"
base_variant = "Dual"
rfn_note = "Sarasa, Iosevka and LXGW are reserved font names; this product carries none of them in its family name. Donors are credited in name IDs 5 and 10."

# Every tag published before the rename shipped this product as
# `SarasaNZSSlab NFM` (KIT-282). Only `sc` has ever shipped, so only `sc` has a
# predecessor: `fontkit release-notes` writes a migration section for a renamed
# product and a "this one is new" line for a product that never had another
# name, and it needs the manifest to tell the two apart.
[naming.former]
sc = "SarasaNZSSlab NFM"

[calibration.regular]
source_weight = "regular"
embolden = 7.5

[calibration.bold]
source_weight = "regular"
embolden = 24

