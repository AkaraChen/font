schema_version = 1
family = "rounded"

[build]
profiles = ["coding"]
regions = ["sc"]
weights = ["regular", "bold"]
formats = ["ttf", "woff2"]
slopes = ["upright"]

[[build.matrix]]
profile = "coding"
regions = ["sc"]
weights = ["regular", "bold"]
formats = ["ttf", "woff2"]
slopes = ["upright"]

[sources.iosevka]
role = "latin"
repository = "https://github.com/be5invis/Iosevka"
version = "v34.8.0"

[sources.iosevka.artifacts.archive]
file = "PkgTTF-IosevkaCurly.zip"
url = "https://github.com/be5invis/Iosevka/releases/download/v34.8.0/PkgTTF-IosevkaCurly-34.8.0.zip"
sha256 = "9a126d1cda838c1646943044d3b27693fa0d2f827787c5821e95de13d9ed0ac0"

[sources.rhr]
role = "cjk"
repository = "https://github.com/CyanoHao/Resource-Han-Rounded"
version = "v0.990"
regions = ["sc"]

[sources.rhr.artifacts.archive]
file = "RHR-CN.7z"
url = "https://github.com/CyanoHao/Resource-Han-Rounded/releases/download/v0.990/RHR-CN-0.990.7z"
sha256 = "e7005f7b4a7a0b8352d32c4a1358ff47564eb73be7fdb2db00d9f792755e9dc7"

[grid]
en_adv = 500
cjk_adv = 1000
upm = 1000
latin_src_adv = 500
latin_src_upm = 1000
latin_target_upm = 1000

# Was `IosevkaCurlyRHR NFM` (KIT-282). Resource Han Rounded ships CN/TW/HK/JP/KR
# masters, so this family can take the full region axis — but the pins here are
# CN only and adding the other four is a pin change, not a naming change.
[naming]
version = "1.0.0-beta.1"
house = "AKR"
style = "Round"
variant = "NFM"
base_variant = "Dual"
rfn_note = "Iosevka and Source Han are reserved font names; this product carries neither in its family name. Donors are credited in name IDs 5 and 10."
product_name_zh = "圆体"

# Pre-rename name; see docs/naming-migration.md.
[naming.former]
sc = "IosevkaCurlyRHR NFM"

[merge]
version = "1.000"
sources_note = "Iosevka Curly + Resource Han Rounded"
# Iosevka Curly is ~46k glyphs at UPM 1000 — subset to the coding ranges before
# the CJK import or the product cannot fit TrueType's 65535-glyph budget.
latin = "normalize"
latin_subset = "coding"
cjk = "normalize"
# RHR carries its own Latin; it is a different design, so only the CJK side
# comes across.
import_policy = "cjk-side"
placement = "center"
glyph_prefix = "cjk."
required_sample = "中文荷塘月色"
# Iosevka's masters leave OS/2 weight flags at the Regular values.
set_weight_class = true
recalc_bounds = true

[metrics.coding]
hhea_ascent = 1000
hhea_descent = -200
hhea_line_gap = 0
os2_typo_ascender = 875
os2_typo_descender = -125
os2_typo_line_gap = 0
os2_win_ascent = 1050
os2_win_descent = 250

[calibration.regular]
source_weight = "regular"
embolden = 0

[calibration.bold]
source_weight = "bold"
embolden = 0

[nerd]
version = "4.26.0"
commit = "64b7726c2fc3fb9bfe74a3621d317a6d3319d908"
hash = "sha256-ilk38WIHygLsxo6BruwVaqTk/T+VobB4jzLc5jxcpL0="

[options]
iosevka_variant = "Curly"
iosevka_style_note = "ss20 Curly Style (PkgTTF-IosevkaCurly)"
iosevka_ttf_regular = "IosevkaCurly-Regular.ttf"
iosevka_ttf_bold = "IosevkaCurly-Bold.ttf"
rhr_ttf_regular = "ResourceHanRoundedCN-Regular.ttf"
rhr_ttf_bold = "ResourceHanRoundedCN-Bold.ttf"
