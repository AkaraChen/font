schema_version = 1
family = "sans"

[build]
profiles = ["coding"]
# Every region IBM ships a Plex Sans master for. `hk` is absent because Plex
# has no Hong Kong master, not because nobody got round to it — see
# [[build.unsupported]] below.
regions = ["sc", "tc", "jp", "kr"]
weights = ["regular", "bold"]
formats = ["ttf", "woff2"]
slopes = ["upright"]

[[build.matrix]]
profile = "coding"
regions = ["sc", "tc", "jp", "kr"]
weights = ["regular", "bold"]
formats = ["ttf", "woff2"]
slopes = ["upright"]

# Not an oversight. IBM Plex Sans ships SC / TC / JP / KR and no HK master, and
# a Hong Kong build is not a relabelled Traditional one: HK has its own
# 香港增補字符集 forms. Substituting TC would ship a font whose name claims
# a variant it does not draw.
[[build.unsupported]]
axis = "regions"
values = ["hk"]
reason = "IBM Plex Sans has no HK master, and HKSCS forms differ from TC — relabelling the TC master would claim a variant the outlines do not draw"

[sources.lilex]
role = "latin"
repository = "https://github.com/mishamyrt/Lilex"
version = "2.700"

[sources.lilex.artifacts.archive]
file = "Lilex.zip"
url = "https://github.com/mishamyrt/Lilex/releases/download/2.700/Lilex.zip"
sha256 = "34310edb4ba749f772d42b88e3eec4a6318527e75ceeaa96cfc556ee35366fbc"

