[grid]
en_adv = 550
cjk_adv = 1100
upm = 1000
latin_src_adv = 600

# Was `LilexSansSC NFM`, which baked two upstream reserved names into name
# ID 1. The house name is ours (KIT-282); the donors are credited in name ID 5,
# name ID 10, the README and the release notes, which is where RFN attribution
# belongs anyway.
[naming]
house = "AKR"
style = "Sans"
variant = "NFM"
base_variant = "Dual"
rfn_note = "Lilex and Plex are reserved font names; this product carries neither in its family name. Donors are credited in name IDs 5 and 10."

# What this product was called before the rename. Only SC ever shipped —
# TC / JP / KR are new products with no predecessor, so they are absent here
# rather than listed with the SC name (fontkit.release_notes).
[naming.former]
sc = "LilexSansSC NFM"

[merge]
version = "1.000"
sources_note = "Lilex + Plex Sans {region}"
# Lilex's mono cell is a known 600 at UPM 1000, so the Latin side needs no
# normalising and no measuring — scale straight onto the 550 cell.
latin = "scale"
cjk = "as-is"
# Plex covers codepoints Lilex does not (Greek/Cyrillic gaps, symbols), and
# those are worth having even outside the CJK ranges.
import_policy = "cjk-side-or-missing"
placement = "center"
glyph_prefix = "sc."
required_sample = "中文荷塘月色"
recalc_bounds = true

# IBM Plex Sans KR is Hangul, not Han: 12183 codepoints, of which essentially
# all are Hangul syllables, jamo and punctuation — 中 is not in it, and neither
# is 韓 or 國. That is upstream's design, not a broken pin, so the Korean
# product is a Hangul + Latin coding face and its smoke test has to be Hangul.
#
# The alternative was to weaken the check to "some glyphs arrived", which would
# have turned a real gate into a green one for all four regions to hide one.
[merge.regions.kr]
required_sample = "한글조판검사"

[metrics.coding]
hhea_ascent = 1025
hhea_descent = -275
hhea_line_gap = 0
os2_typo_ascender = 880
os2_typo_descender = -220
os2_typo_line_gap = 0
os2_win_ascent = 1060
os2_win_descent = 300

[calibration.regular]
source_weight = "regular"
embolden = 5

[calibration.bold]
source_weight = "bold"
embolden = 4

[nerd]
version = "4.26.0"
commit = "64b7726c2fc3fb9bfe74a3621d317a6d3319d908"
hash = "sha256-ilk38WIHygLsxo6BruwVaqTk/T+VobB4jzLc5jxcpL0="

[options]
lilex_ttf_regular = "ttf/Lilex-Regular.ttf"
lilex_ttf_bold = "ttf/Lilex-Bold.ttf"

# The 2:1 gate's fixed CJK sample, per region (KIT-282).
#
# `fontkit verify-2to1`'s built-in sample is Simplified — 测试宽对编释 etc. —
# which is the right question for the SC product and the wrong one for the
# other three: Plex Sans TC draws 測 and not 测, Plex Sans JP has neither 齐 nor
# 検, and Plex Sans KR has no Han at all. Every character below is verified
# present at the full cell in its own product, so this stays a gate rather than
# becoming a formality.
#
# `sc` deliberately has no entry: it keeps the built-in sample, so the SC
# product is gated on exactly what it was gated on before this phase.
gate_cjk_sample_tc = "中文測試字體等寬對齊漢字編程註釋字符串"
gate_cjk_sample_jp = "日本語組版検査全角文字等幅整列"
gate_cjk_sample_kr = "한글조판검사전각문자정렬"
