[sources.wenkai]
role = "cjk"
repository = "https://github.com/lxgw/LxgwWenKai"
version = "v1.522"
regions = ["sc"]

[sources.wenkai.artifacts.regular]
file = "LXGWWenKai-Regular.ttf"
url = "https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Regular.ttf"
sha256 = "39ad71264b588165b469e35e6afb162a378dacd1f95348160240ba9038ac3009"

[sources.wenkai.artifacts.medium]
file = "LXGWWenKai-Medium.ttf"
url = "https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Medium.ttf"
sha256 = "d4bdeb38a39151d74d084cba5090f8cb7d20bf83eedb78c35939ae70b9f4e3f6"

[grid]
en_adv = 500
cjk_adv = 1000
upm = 1000
latin_src_adv = 1240
latin_src_upm = 2000
latin_narrow_adv = 1111
latin_uniform_scale = 0.9

# Was `RadonWenKai NFM` (KIT-282) — the rename the old rfn_note kept asking for.
[naming]
house = "AKR"
style = "Hand"
variant = "NFM"
rfn_note = "Radon and LXGW WenKai are reserved font names; this product carries neither in its family name. Donors are credited in name IDs 5 and 10."

# Pre-rename names, per profile: the two faces were renamed separately because
# they are two products. See docs/naming-migration.md.
[naming.former]
sc = "RadonWenKai NFM"

# A separate family, not a style of the coding one. Installed side by side they
# have to be two entries in a font menu: the NFM face claims the terminal grid
# and carries 4000 Nerd icons, the Text face does neither, and a host that
# thought they were one family would pick either of them for "Bold".
[naming.text]
variant = "Text"

[naming.text.former]
sc = "RadonWenKai Text"

[merge]
version = "1.000"
# {slant} is filled from [calibration.<weight>].slant_deg, per weight — the CJK
# shear is the italic mechanism, so it is a parameter and not a constant.
sources_note = "Monaspace Radon NF + LXGW WenKai {slant}° slant"
# Both sides arrive on the product grid already: latin-prepared narrows and
# scales Radon, cjk-prepared weight-matches and shears WenKai. A UPM mismatch
# here would mean one of those steps is wrong, so it is an error, not a fixup.
latin = "none"
cjk = "require-same-upm"
# A terminal sizes cells from Unicode East_Asian_Width and never asks the font,
# so the cell an import lands on is decided per codepoint rather than per range.
import_policy = "east-asian-width"
placement = "fit"
glyph_prefix = "wk."
required_sample = "中文荷塘月色霞鹜楷编程注释"
# Radon's Nerd icons draw at one cell but several are EAW-wide, so a terminal
# reserves two for them regardless.
widen_wide_base_glyphs = true
drop_vertical_metrics = true
check_glyph_budget = true

# name ID 5 has to name the donor this profile actually used, and the text
# profile's Latin is the plain Radon rather than the pre-patched NF build.
# Everything else about the merge is either the family's (above) or the scene's
# (fontkit.merge.PROFILE_RULES) and is not restated here.
[merge.text]
sources_note = "Monaspace Radon + LXGW WenKai {slant}° slant"

[metrics.coding]
hhea_ascent = 950
hhea_descent = -250
hhea_line_gap = 0
os2_typo_ascender = 880
os2_typo_descender = -220
os2_typo_line_gap = 0
os2_win_ascent = 1032
os2_win_descent = 290

# The reading line box. Same ink as the coding profile — the ascender and
# descender are properties of the two designs, not of the scene — but with
# leading, which is the whole difference: a terminal packs lines against each
# other and prose does not. 880 + 220 + 200 = 1.30 em, which is where Han stops
# looking cramped without the paragraph coming apart.
#
# hhea repeats typo rather than carrying the old 950/-250: USE_TYPO_METRICS is
# set, so anything reading hhea instead is a host that got it wrong, and it
# should get the same answer.
[metrics.text]
hhea_ascent = 880
hhea_descent = -220
hhea_line_gap = 200
os2_typo_ascender = 880
os2_typo_descender = -220
os2_typo_line_gap = 200
os2_win_ascent = 1032
os2_win_descent = 290

# Per weight, never Regular's numbers reused: the CJK master and the embolden
# strength are what match WenKai's stroke to Radon's at that weight. This table
# is shared by both profiles on purpose — `cjk-prepared` has no `profile` axis
# (nix/granularity.nix), because optical stroke matching is about ink and does
# not change when the font is read instead of typed into.

# Measured, not assumed — and the measurement contradicted the plan. KIT-281
# expected Radon Light × WenKai **Light**, on the grounds that both upstreams
# ship one. Scanline vertical-stem medians say otherwise (UPM 1000, the same
# method and the same seven glyphs as the Regular/Bold rows in the README):
#
#   Radon Light, on the product grid   61.6     (Radon Regular 73.3 × 73.77/87.71)
#   WenKai Light                       55.3     Δ −6.3   too light
#   WenKai Regular                     65.8     Δ +4.2   ← and +4.3 is exactly
#                                                          the Regular pairing's
#                                                          accepted offset
#
# So Light pairs with WenKai **Regular**, one step up, for the same reason
# Regular pairs with Medium: Monaspace runs heavy for its nominal weight and
# WenKai runs light, so the CJK side is always taken one notch above the name.
# Unstroked, like Regular — a real design weight beats a stroked one.
[calibration.light]
source_weight = "regular"
embolden = 0
slant_deg = 7.5
slant_pivot_y = 375

[calibration.regular]
source_weight = "medium"
embolden = 0
slant_deg = 7.5
slant_pivot_y = 375

[calibration.bold]
source_weight = "medium"
embolden = 15
slant_deg = 7.5
slant_pivot_y = 375

[options]
src_upm = 2000
ligature_sets = ["ss01", "ss02", "ss03", "ss04", "ss05", "ss06", "ss07", "ss08", "ss09", "ss10"]
