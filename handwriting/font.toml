schema_version = 1
family = "handwriting"

[build]
profiles = ["coding", "text"]
regions = ["sc"]
weights = ["light", "regular", "bold"]
formats = ["ttf", "woff2", "otf"]
slopes = ["upright"]

# The terminal face. No Light: a Light coding face is a legitimate product but
# nobody has calibrated one, and the matrix is what is built, not what is
# possible.
#
# No OTF either, and that is a product decision rather than an impossibility:
# a terminal face is hinted and lives in editors, and the CFF conversion drops
# TrueType hinting (KIT-283). Shipping an unhinted variant of a coding font
# would be offering the reader a worse file in a nicer-sounding format.
[[build.matrix]]
profile = "coding"
regions = ["sc"]
weights = ["regular", "bold"]
formats = ["ttf", "woff2"]
slopes = ["upright"]

# The reading face — the first `text` profile in the repo. LXGW WenKai is a
# 楷体 designed for prose to begin with, which is why handwriting goes first.
#
# This is the one cell in the repo that ships OTF. KIT-281 declared `otf`
# impossible here; KIT-283 reversed that, and the reversal is worth stating
# plainly rather than deleting quietly. The old reasoning was right about the
# mechanics — these products are quadratic (cu2qu from Monaspace, TrueType CJK),
# so an OTF is a real qu2cu conversion of every imported Han glyph and not a
# re-wrap — and wrong about the conclusion: a *reading* face is the one product
# that gets set in print and placed in design tools, which is where CFF is what
# the world asks for. So the conversion is done deliberately, with a declared
# tolerance, and the OTF carries its own fingerprint baseline instead of being
# diffed against the TTF's. See lib/fontkit/convert.py.
[[build.matrix]]
profile = "text"
regions = ["sc"]
weights = ["light", "regular", "bold"]
formats = ["ttf", "woff2", "otf"]
slopes = ["upright"]

[sources.monaspace]
role = "latin"
repository = "https://github.com/githubnext/monaspace"
version = "v1.400"

# The coding profile takes the pre-patched Nerd build; the text profile takes
# the plain static build from the same release. That one difference is the whole
# of "Nerd Font patch: coding 是 / text 否" for this family — there is no
# un-patch step, there is a different donor.
[sources.monaspace.artifacts.regular]
file = "MonaspaceRadonNF-Regular.otf"
fetch = "zip-member"
url = "https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-nerdfonts-v1.400.zip"
sha256 = "7e8bed594c1708f8f45f312339dc182deec7461c47b8fff79f410646baa9a3d2"
member = "NerdFonts/Monaspace Radon/MonaspaceRadonNF-Regular.otf"

[sources.monaspace.artifacts.bold]
file = "MonaspaceRadonNF-Bold.otf"
fetch = "zip-member"
url = "https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-nerdfonts-v1.400.zip"
sha256 = "81e3e1e8815073a0c979ce1ba327f91b74606d81478fe271d160fcad22fd60eb"
member = "NerdFonts/Monaspace Radon/MonaspaceRadonNF-Bold.otf"

[sources.monaspace.artifacts.text_light]
file = "MonaspaceRadon-Light.otf"
fetch = "zip-member"
url = "https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-static-v1.400.zip"
sha256 = "37f20a2b57c4a6898c97c2bf2dcd67086c61106c13e0b8e580f913a3aa1be5da"
member = "Static Fonts/Monaspace Radon/MonaspaceRadon-Light.otf"

[sources.monaspace.artifacts.text_regular]
file = "MonaspaceRadon-Regular.otf"
fetch = "zip-member"
url = "https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-static-v1.400.zip"
sha256 = "08f34b2865c89fb04900bfa6573513493359270dc5a9497769be6fc447d5d0b8"
member = "Static Fonts/Monaspace Radon/MonaspaceRadon-Regular.otf"

[sources.monaspace.artifacts.text_bold]
file = "MonaspaceRadon-Bold.otf"
fetch = "zip-member"
url = "https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-static-v1.400.zip"
sha256 = "22b144cf8308b1ad78cd3c56d9a5d3aa939d51efe293b65898c18504a527c87e"
