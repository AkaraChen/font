# Build every matrix cell from source in the pinned Nix toolchain, then diff
# the products against the committed fingerprint baselines.
#
# Before this workflow existed the only CI in the repo was release-nfm.yml,
# which is serif-only and does not build from source — it downloads the previous
# tag's products and post-processes them. Six of the seven families had no
# automated verification at all.
#
# Every step is timed.
#
# Caching (KIT-275 / KIT-304) is deliberately layered rather than one snapshot
# of /nix, because GitHub Actions cache is capped at 10 GB per repository and
# evicts anything untouched for 7 days. See docs/caching.md for the full
# reasoning and the measured numbers; the short version:
#
#   * three small "warmer" jobs SAVE —
#       sources      (keyed on a sources-only projection of font.toml, not the
#                     whole file — a [naming] version bump must not re-fetch
#                     700 MiB of pins)
#       toolchain    (keyed on flake.lock + flake.nix)
#       intermediates (latin-prepared + serif-sarasa; keyed on their real inputs)
#   * the matrix cell jobs RESTORE all three and save nothing
#
# That last line is the whole 10 GB story. Cell jobs each saving their own
# multi-gigabyte store snapshot would blow the repo budget on a single push
# and evict the layers that actually pay for themselves.
#
# Matrix axes (KIT-305): every (family, profile, region) cell that
# `[[build.matrix]]` declares — 14 jobs today (sans × 4, pixel × 4,
# handwriting × 2 profiles, and one each for the rest). Region-independent
# work (latin-prepared, serif-sarasa) is warmed once by the intermediates
# layer so fanning out region jobs does not recompute Latin N times.
name: Build matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      families:
        description: "Space-separated subset to build (default: all)"
        required: false
        type: string

permissions:
  contents: read
  # cache-nix-action purges expired entries, and the cache-budget job reads the
  # repo's cache list to check it against the 10 GB ceiling.
  actions: write

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to invalidate every layer at once without touching pins or the flake.
  # v2: sources key switched from hashFiles('*/font.toml') to the sources-only
  # projection (tools/sources-cache-key.py), and the intermediates layer landed.
  CACHE_EPOCH: v2

jobs:
  # Cheap gate, runs in seconds: the shared build steps under lib/fontkit are
  # the only thing in this repo that can break all seven families at once, and
  # waiting three hours for a font build to say so is not a feedback loop.
  fontkit:
    name: fontkit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Unit tests
        run: nix develop --command env PYTHONPATH=lib python3 -m pytest lib/tests -q

      # Builds the buildPythonPackage the per-step derivations will depend on,
      # and runs the same suite against the *installed* copy.
      - name: Build the fontkit package
        run: nix build .#fontkit --print-build-logs

  # ---------------------------------------------------------------------------
  # Layer 1 — pinned upstream sources.
  #
  # Biggest and slowest-changing: ~715 MiB on the Linux runner (source-cache +
  # Sarasa tree + font-patcher; measured via tools/cache-report.sh). Keyed on a
  # sources-only projection of the manifests (tools/sources-cache-key.py), so a
  # toolchain bump or a pure [naming] version bump does not re-download it.
  # ---------------------------------------------------------------------------
  sources:
    name: Sources layer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # hashFiles() is fixed at job start, so a generated file cannot feed it.
      # Hash the projection in a step instead (tools/sources-cache-key.py).
      - name: Sources cache key
        id: src-key
        run: echo "digest=$(python3 tools/sources-cache-key.py --digest)" >> "$GITHUB_OUTPUT"

      - name: Restore / save source layer
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-src-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ steps.src-key.outputs.digest }}
          # No prefix fallback on purpose: a partial source layer from an older
          # pin set is worse than a clean fetch — it would be carried forward,
          # counted against the 10 GB budget, and never used.
          gc-max-store-size-linux: 3G
          purge: true
          purge-prefixes: nix-src-${{ env.CACHE_EPOCH }}-${{ runner.os }}-
          purge-created: P7D

      - name: Realise pinned sources
        run: |
          # --out-link, not --no-link: these must be GC roots, or the action's
          # pre-save `nix store gc` deletes exactly what we are trying to cache.
          nix build --out-link result-sources .#source-cache
          nix build --out-link result-sarasa  .#sarasa-src
          # Five families share one sparse checkout; root it here so the family
          # jobs do not each re-fetch the nerd-fonts tree on a cold mid layer.
          nix build --out-link result-patcher .#font-patcher

      - name: Report layer size
        run: tools/cache-report.sh sources result-sources result-sarasa result-patcher

  # ---------------------------------------------------------------------------
  # Layer 2 — the pinned toolchain (devShell closure).
  # ---------------------------------------------------------------------------
  toolchain:
    name: Toolchain layer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Restore / save toolchain layer
        uses: nix-community/cache-nix-action@v7
        with:
          # flake.nix is in the key as well as flake.lock: the harfbuzz-with-cairo
          # override lives in flake.nix, and editing it rebuilds the shell without
          # moving the lock.
          primary-key: nix-tool-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-tool-${{ env.CACHE_EPOCH }}-${{ runner.os }}-
          purge-created: P7D

      - name: Realise devShell
        run: |
          # --profile, not `nix build` on the shell derivation: building a
          # mkShell gives an output that does not *reference* the toolchain, so
          # its closure would measure as near-empty and nothing would be rooted
          # for the pre-save GC. A profile roots the whole environment, which is
          # exactly what this layer is supposed to keep.
          nix develop --profile result-shell --command true

      # KIT-297. `fontTools 4.60.1` in the provenance line was never enough to
      # explain why two machines disagreed — this prints the things that
      # actually decide it: whether the Cython accelerators are compiled, what
      # the platform libm returns, and the digest of the two build steps that
      # consume it.
      #
      # It stays useful now that fonts are Linux-only, because the thing it
      # guards against is CI's *own* toolchain moving under a nixpkgs bump: an
      # accelerator flipping from `py` to `so` would change outlines and this is
      # the only place it would be visible before the fingerprints went red.
      # `just toolchain-fingerprint` prints the same table anywhere.
      - name: Toolchain fingerprint
        run: nix develop --command python3 tools/toolchain-fingerprint.py | tee toolchain-fingerprint.txt

      - name: Upload toolchain fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-fingerprint-${{ runner.os }}
          path: toolchain-fingerprint.txt

      - name: Report layer size
        run: tools/cache-report.sh toolchain result-shell

  # ---------------------------------------------------------------------------
  # Layer 3 — selective intermediate products (KIT-304).
  #
  # Family jobs used to restore sources + toolchain and rebuild every step
  # above that from scratch every run. The products layer as a whole does not
  # fit the remaining budget; these two do, and they are the ones that pay:
  #
  #   * latin-prepared  — shared across regions (and, for handwriting, built
  #                       once per profile × weight)
  #   * serif-sarasa    — the multi-minute upstream npm build
  #
  # Keyed on tools/intermediates-cache-key.py so a [naming] version bump does
  # not throw them away. Final packaged faces are still not cached.
  # ---------------------------------------------------------------------------
  intermediates:
    name: Intermediates layer
    needs: [sources, toolchain]
    runs-on: ubuntu-latest
    # serif-sarasa is the long pole of this job on a cold mid layer.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Layer keys
        id: keys
        run: |
          echo "src=$(python3 tools/sources-cache-key.py --digest)" >> "$GITHUB_OUTPUT"
          echo "mid=$(python3 tools/intermediates-cache-key.py --digest)" >> "$GITHUB_OUTPUT"

      # Pull the two cheaper layers first so eval / builds do not re-fetch pins
      # or the toolchain. Restore-only: this job must not rewrite them.
      - name: Restore sources + toolchain
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-mid-bootstrap-${{ env.CACHE_EPOCH }}-${{ runner.os }}-never-saved
          restore-prefixes-all-matches: |
            nix-src-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ steps.keys.outputs.src }}
            nix-tool-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}

      - name: Restore / save intermediates layer
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-mid-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ steps.keys.outputs.mid }}
          # Small on purpose: the outputs are a handful of TTFs. 1.5G leaves
          # headroom for their closures without crowding sources + toolchain.
          gc-max-store-size-linux: 1.5G
          purge: true
          purge-prefixes: nix-mid-${{ env.CACHE_EPOCH }}-${{ runner.os }}-
          purge-created: P7D

      - name: Realise intermediates
        run: |
          start=$SECONDS
          # Single GC root covering every selectively-cached step. On a hit this
          # is a no-op; on a miss it is where serif-sarasa spends its minutes.
          nix build --out-link result-mid --print-build-logs .#ci-intermediates
          echo "ci-intermediates realised in $(( SECONDS - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Report step closures
        run: |
          # Per-step sizes are what decide whether a future step joins this
          # layer. path-info -S on each symlink under the linkFarm.
          {
            echo "## Intermediate step closures"
            echo
            echo "| step | closure |"
            echo "| --- | ---: |"
            for link in result-mid/*; do
              name="$(basename "$link")"
              # Anchor the path: bare words are flake refs to `nix path-info`.
              size="$(nix path-info --json -S "./$link" \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); vs=list(d.values()) if isinstance(d,dict) else d; print(sum(v["closureSize"] for v in vs))')"
              printf '| `%s` | %s |\n' "$name" "$(numfmt --to=iec --suffix=B "$size")"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          tools/cache-report.sh intermediates result-mid

  # Pure eval of `.#lib.matrix` — one row per (family, profile, region) cell
  # that `[[build.matrix]]` declares. The build job's strategy.matrix is this
  # list rather than a hand-maintained include table, so a new region in
  # font.toml becomes a CI job without a workflow edit (KIT-305).
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cells: ${{ steps.gen.outputs.cells }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Emit cells from lib.matrix
        id: gen
        run: |
          set -euo pipefail
          wanted='${{ github.event.inputs.families }}'
          cells=$(
            nix eval --json .#lib.matrix \
              | jq -c --arg wanted "$wanted" '
                  [ .[]
                    | select(
                        ($wanted | length) == 0
                        or (($wanted | split(" ")) | index(.family) != null)
                      )
                    | {family, profile, region, attr}
                  ]
                '
          )
          count=$(jq 'length' <<<"$cells")
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          {
            echo "## Matrix cells ($count)"
            echo
            echo "| family | profile | region | attr |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| `\(.family)` | `\(.profile)` | `\(.region)` | `\(.attr)` |"' <<<"$cells"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.family }}/${{ matrix.profile }}/${{ matrix.region }}
    needs: [sources, toolchain, intermediates, plan]
    runs-on: ubuntu-latest
    # Before the region axis was a matrix dimension, the critical path was the
    # sans family job at ~14 m (four regions serial). After the split it is
    # serif's Sarasa build (~10 m cold; lower with a warm intermediates hit).
    # 60 m is still loose for a stuck job but far tighter than the old 300 m
    # "no measured number yet" ceiling.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.cells) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Layer keys
        id: keys
        run: |
          echo "src=$(python3 tools/sources-cache-key.py --digest)" >> "$GITHUB_OUTPUT"
          echo "mid=$(python3 tools/intermediates-cache-key.py --digest)" >> "$GITHUB_OUTPUT"

      # Restore-only. Cell jobs must never save: with 14 cells, each writing a
      # multi-gigabyte store snapshot would exhaust the repository budget and
      # evict the warmers that pay for themselves (KIT-275 / KIT-304 / KIT-305).
      #
      # No binary cache — cachix / attic were both considered and declined for
      # this repo (KIT-275). What is cached is the store itself, in three layers.
      - name: Restore cached layers
        uses: nix-community/cache-nix-action/restore@v7
        with:
          # This key is never written, so it always misses and always falls
          # through to the three prefixes below — which is the intent.
          primary-key: nix-build-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ matrix.attr }}-never-saved
          restore-prefixes-all-matches: |
            nix-src-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ steps.keys.outputs.src }}
            nix-tool-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
            nix-mid-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ steps.keys.outputs.mid }}

      - name: Realise devShell
        run: |
          start=$SECONDS
          nix develop --command true
          echo "devShell realised in $(( SECONDS - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Toolchain provenance
        run: |
          nix develop --command bash -c '
            for c in curl git unzip zip 7z fontforge ttfautohint node npm \
                     hb-view otc2otf otf2ttf python3; do
              printf "%-14s %s\n" "$c" "$(command -v "$c")"
            done
            python3 -c "import fontTools; print(\"fontTools\", fontTools.version)"
          '

      # One matrix cell: `just build sans coding tc` → .#sans-coding-tc into
      # sans/out-coding-tc. The full-family form still exists for local use;
      # CI never calls it, because that is the serial path KIT-305 retired.
      - name: Build cell
        run: |
          start=$SECONDS
          nix develop --command just build \
            ${{ matrix.family }} ${{ matrix.profile }} ${{ matrix.region }}
          echo "cell ${{ matrix.attr }} built in $(( SECONDS - start ))s" \
            >> "$GITHUB_STEP_SUMMARY"

      # Cell-scoped gate. Multi-region families expose
      # .#<family>-<profile>-<region>-verify so this does not realise sibling
      # cells; single-cell families alias the family-wide verify under that
      # name (nix/families/default.nix).
      - name: Gate
        run: |
          start=$SECONDS
          nix build --print-build-logs .#${{ matrix.attr }}-verify
          echo "gate ${{ matrix.attr }}-verify in $(( SECONDS - start ))s" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Fingerprint check
        run: |
          set +e
          products="${{ matrix.family }}/out-${{ matrix.profile }}-${{ matrix.region }}"
          # --partial: only this cell's products are present; sibling cells
          # live in other matrix jobs and must not be reported MISSING.
          nix develop --command python3 tools/fingerprint.py check \
            ${{ matrix.family }} \
            --products-dir "$products" \
            --partial
          rc=$?
          set -e
          # Always publish what this run actually produced, whatever the verdict.
          # Products are awkward to pull; the fingerprints are a few hundred KB,
          # so drift can be diagnosed — and a baseline adopted — from the artifact.
          nix develop --command python3 tools/fingerprint.py write \
            ${{ matrix.family }} \
            --products-dir "$products" \
            --out fingerprints-current/${{ matrix.attr }}
          case "$rc" in
            0) echo "fingerprints match the baseline (cell ${{ matrix.attr }})" ;;
            3)
              echo "::warning title=Fingerprint baseline missing::${{ matrix.attr }} has products with no committed baseline (see the step log for which). Download the fingerprints-${{ matrix.attr }} artifact from this run and commit the matching entries under fingerprints/${{ matrix.family }}/."
              ;;
            *) exit "$rc" ;;
          esac

      - name: Upload fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprints-${{ matrix.attr }}
          path: fingerprints-current/${{ matrix.attr }}/
          if-no-files-found: warn

      - name: Upload products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.attr }}
          path: ${{ matrix.family }}/out-${{ matrix.profile }}-${{ matrix.region }}/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The 10 GB ceiling is a repository-wide budget with no warning when you cross
  # it — GitHub just starts evicting, oldest first, and the symptom is a build
  # that mysteriously got slow again. So: measure it every run, in the open.
  #
  # "不要静默截断" — whatever the caching strategy drops has to be legible here.
  # ---------------------------------------------------------------------------
  cache-budget:
    name: Cache budget
    needs: [sources, toolchain, intermediates, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Drop obsolete CACHE_EPOCH entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # v2 re-keyed sources and added the intermediates layer. Orphan v1
          # keys only compete for the 10 GB ceiling (they hit 99% on 2026-07-29
          # via duplicate src/tool entries). Drop anything not under the live
          # epoch so the new layers have room.
          epoch="${{ env.CACHE_EPOCH }}"
          deleted=0
          while read -r id key; do
            [[ -n "$id" ]] || continue
            case "$key" in
              nix-*-${epoch}-*) continue ;;
            esac
            if [[ "$key" == nix-src-* || "$key" == nix-tool-* || "$key" == nix-mid-* ]]; then
              echo "delete $key"
              gh cache delete "$id" && deleted=$(( deleted + 1 )) || true
            fi
          done < <(gh cache list --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"')
          echo "Deleted ${deleted} obsolete cache entries."

      - name: Account for GitHub Actions cache usage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          limit=$(( 10 * 1024 * 1024 * 1024 ))

          gh cache list --limit 100 \
            --json key,sizeInBytes,createdAt,lastAccessedAt > caches.json

          total=$(jq '[.[].sizeInBytes] | add // 0' caches.json)
          pct=$(( total * 100 / limit ))

          {
            echo "## GitHub Actions cache budget"
            echo
            echo "Using **$(numfmt --to=iec "$total")** of the 10 GiB repository"
            echo "ceiling (${pct}%). Entries are evicted after 7 days without a read."
            echo
            echo "| key | size | created | last read |"
            echo "| --- | ---: | --- | --- |"
            jq -r 'sort_by(-.sizeInBytes)[]
              | "| `\(.key)` | \(.sizeInBytes) | \(.createdAt) | \(.lastAccessedAt) |"' caches.json \
              | while IFS='|' read -r _ key size created accessed _; do
                  printf '| %s | %s | %s | %s |\n' "$key" \
                    "$(numfmt --to=iec "$(echo "$size" | tr -d ' ')")" "$created" "$accessed"
                done
          } >> "$GITHUB_STEP_SUMMARY"

          if (( pct >= 80 )); then
            echo "::warning title=Cache budget::${pct}% of the 10 GiB repository cache is in use. Eviction is oldest-first and silent — drop a layer or lower gc-max-store-size before it starts costing rebuilds."
          fi
