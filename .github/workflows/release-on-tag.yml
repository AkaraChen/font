# Push a tag, get a release: every family, every variant, one release.
#
# The version comes from the tag. `prepare` stamps it into all seven manifests
# before anything is built, so the archive names and the tag cannot disagree —
# no bumping seven files by hand first.
#
# A version containing `-` (e.g. 1.0.0-beta.1) publishes as a pre-release.
name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-on-tag-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same epoch as build-matrix.yml — both restore the same two cache layers.
  CACHE_EPOCH: v1

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      families: ${{ steps.v.outputs.families }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - id: v
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          families=$(nix eval --json .#lib.matrix | jq -r '[.[].family] | unique | sort | @json')
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "families=$families"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "## ${GITHUB_REF_NAME} — $(jq -r 'join(", ")' <<<"$families")" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.family }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJson(needs.prepare.outputs.families) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Restore-only: seven store snapshots would blow the 10 GB repo budget.
      - uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-reltag-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ matrix.family }}-never-saved
          restore-prefixes-all-matches: |
            nix-src-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ hashFiles('*/font.toml') }}
            nix-tool-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}

      # The tag is the version. Stamped in before the build so the archive name
      # and the tag are the same string by construction.
      - name: Stamp the version
        run: |
          set -euo pipefail
          python3 - "${{ matrix.family }}/font.toml" "${{ needs.prepare.outputs.version }}" <<'PY'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          start = re.search(r'^\[naming\]\s*$', text, flags=re.M).end() + 1
          nxt = re.search(r'^\[', text[start:], flags=re.M)
          end = start + (nxt.start() if nxt else len(text) - start)
          body = text[start:end]
          if re.search(r'^version\s*=', body, flags=re.M):
              body = re.sub(r'^version\s*=\s*".*?"', f'version = "{version}"', body, count=1, flags=re.M)
          else:
              body = f'version = "{version}"\n' + body
          open(path, "w", encoding="utf-8").write(text[:start] + body + text[end:])
          PY
          grep -A1 '^\[naming\]' "${{ matrix.family }}/font.toml" | head -3

      # One nix build per cell. The archive derivation depends on the family's
      # gate, so this is the gate run too.
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p assets
          nix eval --json .#lib.matrix \
            | jq -r --arg f "${{ matrix.family }}" '.[] | select(.family==$f) | "\(.profile) \(.region)"' \
            | while read -r profile region; do
                out=$(nix build --no-link --print-out-paths --print-build-logs \
                      ".#${{ matrix.family }}-${profile}-${region}-release")
                cp "$out"/*.zip assets/
              done
          ls -lh assets/

      - name: Release notes
        run: |
          set -euo pipefail
          : > notes-${{ matrix.family }}.md
          nix eval --json .#lib.matrix \
            | jq -r --arg f "${{ matrix.family }}" '.[] | select(.family==$f) | "\(.profile) \(.region)"' \
            | while read -r profile region; do
                nix develop --command fontkit release-notes \
                  --manifest "${{ matrix.family }}/font.toml" \
                  --profile "$profile" --region "$region" \
                  --version "${{ needs.prepare.outputs.version }}" >> notes-${{ matrix.family }}.md
                printf '\n' >> notes-${{ matrix.family }}.md
              done

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.family }}
          path: |
            assets/
            notes-${{ matrix.family }}.md
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: incoming

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find incoming -name '*.zip' -exec cp {} release-assets/ \;

          {
            echo "# ${GITHUB_REF_NAME}"
            echo
            echo "Every family, every variant, built from source at \`${GITHUB_SHA}\`."
            echo
            echo "> **Renamed families.** Products use the \`AKR\` house name"
            echo "> (\`AKR Sans SC NFM\`, \`AKR Hand SC Text\`, …). Fonts from a \`v0.1.x\`"
            echo "> release carry their old names, so settings that name a font need"
            echo "> updating. The \`v0.1.x\` tags predate the rename and were serif-only."
            echo
            echo "---"
            echo
          } > notes.md
          for f in $(find incoming -name 'notes-*.md' | sort); do
            cat "$f" >> notes.md
            printf '\n---\n\n' >> notes.md
          done

          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            ${{ needs.prepare.outputs.prerelease == 'true' && '--prerelease' || '--latest' }} \
            release-assets/*

          gh release view "$TAG" --repo "${{ github.repository }}"
