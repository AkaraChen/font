# Build/package SarasaNZSSlab NFM release assets on GitHub-hosted runners
# (uploads.github.com is flaky from some agent networks).
#
# workflow_dispatch inputs:
#   version: e.g. 0.1.5 (no leading v)
#   base_tag: existing product tag to post-process (default v0.1.4)
#   expand_ligatures: fold dlig into calt (KIT-240)
name: Release NFM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 0.1.5)"
        required: true
        type: string
      base_tag:
        description: "Existing release tag providing TTFs to post-process"
        required: true
        default: "v0.1.4"
        type: string
      expand_ligatures:
        description: "Run expand-default-ligatures.py (dlig → calt)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install -U pip fonttools
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip

      - name: Download base product TTFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p serif/out/nerd
          gh release download "${{ inputs.base_tag }}" \
            --repo "${{ github.repository }}" \
            -p 'SarasaNZSSlabNFM-*.ttf' \
            -D serif/out/nerd
          ls -lh serif/out/nerd

      # Was serif/scripts/expand-default-ligatures.py, which Phase 2 folded into
      # lib/fontkit and this workflow kept calling by its old path.
      - name: Expand default ligatures
        if: ${{ inputs.expand_ligatures }}
        run: |
          PYTHONPATH=lib python3 -m fontkit.expand_ligatures serif/out/nerd/*.ttf

      - name: Verify 2:1 + nerd + EAW
        run: |
          PYTHONPATH=lib python3 -m fontkit.verify2to1 \
            --profile dense --check-nerd --check-eaw serif/out/nerd/*.ttf

      # Was serif/scripts/package-release.sh, deleted with serif's shell pipeline
      # (KIT-280). This workflow post-processes a *previous release's* TTFs
      # rather than building from source, so it cannot use `nix build
      # .#serif-release`, which builds the product it packages. Rewriting the
      # release flow around the derivations is Phase 8 (KIT-283); until then it
      # calls the same packaging step that derivation calls. The zip loses its
      # README.txt in the process: that text is rendered by Nix from font.toml
      # now (nix/families/serif.nix), and there is no Nix in this job.
      - name: Package zip
        run: |
          mkdir -p serif/dist
          PYTHONPATH=lib python3 -m fontkit.package \
            --stem SarasaNZSSlabNFM \
            --version "${{ inputs.version }}" \
            --out serif/dist \
            serif/out/nerd/*.ttf
          ls -lh serif/dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          TAG="v${VER}"
          # Drop empty draft if present (from a failed local attempt)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft)
            if [[ "$DRAFT" == "true" ]]; then
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            else
              echo "Release $TAG already published; abort"
              exit 1
            fi
          fi
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          ## SarasaNZSSlab NFM v${VER}

          Default programming ligatures expanded (KIT-240): fold Iosevka **\`dlig\`** into default **\`calt\`**.

          ### Changes
          - Editors that only enable “font ligatures” / \`calt\` now get discretionary sets too:
            - double chaining: \`++\` \`--\` \`##\` \`~~\`
            - logic / bars: \`/\\\` \`\\/\` \`{|\` \`|}\` \`[|\` \`|]\`
            - markdown checkboxes: \`- [ ]\` \`- [x]\`
            - counter-arrows, \`=<\`, and other former-\`dlig\` ligations
          - Build step: \`scripts/expand-default-ligatures.py\` (runs from \`06-narrow-symbols.sh\`)
          - Based on ${{ inputs.base_tag }} product + ligature post-process

          Still **not** present in Iosevka (nothing to enable): e.g. Fira-style \`&&\`, \`**\`.

          ### Product
          | File | Notes |
          | --- | --- |
          | \`SarasaNZSSlabNFM-Regular.ttf\` | Family **SarasaNZSSlab NFM** |
          | \`SarasaNZSSlabNFM-Bold.ttf\` | same |
          | \`SarasaNZSSlabNFM-${VER}.zip\` | both + README |

          ### Verify
          \`\`\`
          PYTHONPATH=lib python3 -m fontkit.verify2to1 --profile dense \
            --check-nerd --check-eaw out/nerd/*.ttf
          # half=500 full=1000, eaw-violations=0; calt lookups 63→99
          \`\`\`

          PR: https://github.com/AkaraChen/font/pull/6
          Issue: KIT-240
          EOF
          # unindent notes for clean markdown
          sed -i 's/^          //' "$NOTES"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "SarasaNZSSlab NFM v${VER}" \
            --notes-file "$NOTES" \
            --latest \
            "serif/dist/SarasaNZSSlabNFM-${VER}.zip" \
            serif/out/nerd/SarasaNZSSlabNFM-Regular.ttf \
            serif/out/nerd/SarasaNZSSlabNFM-Bold.ttf

          gh release view "$TAG" --repo "${{ github.repository }}"
