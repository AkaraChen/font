cjk_adv = 1000
upm = 1000
latin_src_adv = 600
latin_src_upm = 1000
latin_uniform_scale = 0.833333333

[naming]
family = "RecursiveYozai Dual"
ps = "RecursiveYozaiDual"
stem = "RecursiveYozaiDual"
house = "RecursiveYozai"
style = "Dual"
region = "SC"
variant = "coding"
id16 = "RecursiveYozai Dual"
id17 = "{weight}"
rfn_note = "Recursive and Yozai reserve upstream names; review before public OFL redistribution."
version = "0.1.0"

[merge]
version = "0.1.0"
# BUG, preserved on purpose: this string names Radon and WenKai, which are
# handwriting's donors, not casual's. It is wrong in the shipped name ID 5 of
# every RecursiveYozai Dual built so far, because casual borrowed handwriting's
# merge script and that script hardcoded its own sources. Correcting it moves
# casual's fingerprint, and Phase 5's completion criterion is that no
# fingerprint moves — so it is recorded here, where it is visible, and fixed by
# a change that owns the rebaseline.
sources_note = "Monaspace Radon NF + LXGW WenKai {slant}° slant"
# Both sides arrive prepared: latin-prepared scales Recursive, cjk-prepared
# weight-matches Yozai.
latin = "none"
cjk = "require-same-upm"
import_policy = "east-asian-width"
placement = "fit"
glyph_prefix = "wk."
required_sample = "中文荷塘月色霞鹜楷编程注释"
widen_wide_base_glyphs = true
drop_vertical_metrics = true
check_glyph_budget = true

[metrics.coding]
hhea_ascent = 950
hhea_descent = -250
hhea_line_gap = 0
os2_typo_ascender = 880
os2_typo_descender = -220
os2_typo_line_gap = 0
os2_win_ascent = 1032
os2_win_descent = 290

[calibration.regular]
source_weight = "regular"
embolden = 10
slant_deg = 0
slant_pivot_y = 375

[calibration.bold]
source_weight = "medium"
embolden = 20
slant_deg = 0
slant_pivot_y = 375

